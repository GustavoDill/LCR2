<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Bispado Ala Bosque (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Spectral:wght@500;600;700&display=swap">
<style>
/* Layout: cabeçalho da ala + abas fixas; cada aba é uma coluna de trabalho; a reunião é uma pauta em acordeão com anotações ao vivo. Azul = Bispado, verde = Conselho. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --surface-2:#f7f9f8; --ink:#16201e; --muted:#5a6865; --line:#d8e0dd;
  --bisp:#24477a; --bisp-soft:#e2e9f4; --cons:#2d6a4d; --cons-soft:#dfeee6;
  --warn:#9a5b0c; --warn-soft:#fbecd7; --crit:#a3302b; --crit-soft:#f8e0de;
  --on-accent:#ffffff; --shadow:0 1px 2px rgba(22,32,30,.06),0 6px 24px rgba(22,32,30,.06);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101715; --surface:#17201e; --surface-2:#1c2624; --ink:#e5ece9; --muted:#97a6a2; --line:#2a3633;
  --bisp:#93b3e8; --bisp-soft:#1b2a40; --cons:#7fc4a0; --cons-soft:#163029;
  --warn:#e5a85c; --warn-soft:#382915; --crit:#ee8d86; --crit-soft:#3b1e1c;
  --on-accent:#0e1513; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101715; --surface:#17201e; --surface-2:#1c2624; --ink:#e5ece9; --muted:#97a6a2; --line:#2a3633;
  --bisp:#93b3e8; --bisp-soft:#1b2a40; --cons:#7fc4a0; --cons-soft:#163029;
  --warn:#e5a85c; --warn-soft:#382915; --crit:#ee8d86; --crit-soft:#3b1e1c;
  --on-accent:#0e1513; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--bisp);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:20px 12px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-size:30px;font-weight:700;letter-spacing:-.01em}
.today{color:var(--muted);font-size:13px;text-align:right}
.today b{color:var(--ink);font-weight:600}
.sync{font-size:12px;color:var(--muted)}

.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding-inline:16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--surface)}
.tab.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}
.badge{font-size:11px;min-width:18px;height:18px;border-radius:9px;padding:0 5px;display:inline-grid;place-items:center;font-weight:700}
.badge.crit{background:var(--crit);color:var(--on-accent)}
.live{width:8px;height:8px;border-radius:50%;background:var(--cons);box-shadow:0 0 0 3px var(--cons-soft)}

main{padding-block:20px}
.stack{display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h2{font-size:24px}
.sub{color:var(--muted);font-size:14px;max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{font-size:18px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid2>*{min-width:0}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.bisp{background:var(--bisp);color:var(--on-accent);border-color:var(--bisp)}
.btn.cons{background:var(--cons);color:var(--on-accent);border-color:var(--cons)}
.btn.danger{background:var(--crit);color:var(--on-accent);border-color:var(--crit)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.7;margin-left:4px}

.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:5px;white-space:nowrap}
.tag-bispado{background:var(--bisp-soft);color:var(--bisp)}
.tag-conselho{background:var(--cons-soft);color:var(--cons)}
.tag-late{background:var(--crit-soft);color:var(--crit)}
.tag-soft{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.st{border:0;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.st-pendente{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.st-andamento{background:var(--warn-soft);color:var(--warn)}
.st-concluida{background:var(--cons-soft);color:var(--cons)}
.st[disabled]{cursor:default}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px}
.stat .v{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.stat .x{font-size:12px;font-weight:600;margin-top:2px}
.x.crit{color:var(--crit)} .x.ok{color:var(--cons)}

.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.row-t{font-weight:600;overflow-wrap:anywhere}
.row-m{font-size:13px;color:var(--muted);display:flex;gap:4px 10px;flex-wrap:wrap;margin-top:2px}
.row-n{font-size:13px;margin-top:4px;color:var(--ink);overflow-wrap:anywhere}
.late-txt{color:var(--crit);font-weight:600}
.row .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.empty-s{color:var(--muted);font-size:13px;padding:6px 0}

.notice{padding:12px 14px;border-radius:var(--r);font-size:14px;background:var(--surface-2);border:1px solid var(--line)}
.notice.bisp{background:var(--bisp-soft);border-color:transparent;color:var(--ink)}
.notice.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.notice b{font-weight:700}

/* reuniões */
.mt{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.mt.bispado{border-top:4px solid var(--bisp)}
.mt.conselho{border-top:4px solid var(--cons)}
.mt h3{font-size:21px}
.mt .q{font-family:var(--f-display);font-style:italic;font-size:17px;line-height:1.4}
.mt .who{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:84px;line-height:1.5}
.inp:focus{outline:2px solid var(--bisp);outline-offset:0;border-color:transparent}
.inp[readonly]{background:var(--surface-2)}

.mhead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.mhead .ttl{display:flex;flex-direction:column;gap:4px}
.mhead h2{font-size:24px}
.meta{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--muted)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);font-size:18px}
.clock.over{color:var(--crit)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:120px;flex:1;max-width:220px}
.bar i{display:block;height:100%;background:var(--ink)}
.mt-bispado .bar i{background:var(--bisp)} .mt-conselho .bar i{background:var(--cons)}

.pauta{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sec{border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec-h{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}
.sec-h:focus-visible{outline:2px solid var(--bisp);outline-offset:-2px}
.sec-h:hover{background:var(--surface-2)}
.key{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:1.5px solid var(--kc);color:var(--kc)}
.mt-bispado{--kc:var(--bisp);--ks:var(--bisp-soft)} .mt-conselho{--kc:var(--cons);--ks:var(--cons-soft)}
.sec.done .key{background:var(--kc);color:var(--on-accent)}
.sec-t{flex:1;font-weight:600;min-width:0}
.sec.done .sec-t{color:var(--muted)}
.sec-min{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.has-note{width:7px;height:7px;border-radius:50%;background:var(--kc)}
.caret{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
.sec.open .caret{transform:rotate(-135deg);margin-top:4px}
.sec-b{padding:4px 16px 18px 58px;display:flex;flex-direction:column;gap:14px}
.quote{font-family:var(--f-display);font-style:italic;font-size:17px;border-left:3px solid var(--kc);padding-left:12px}
.prompts{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.prompts li{font-size:13px;padding:3px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.grp{display:flex;flex-direction:column;gap:6px}
.grp .lbl{text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.qs{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.warnline{font-size:13px;color:var(--warn);background:var(--warn-soft);padding:6px 10px;border-radius:6px}
.embed{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.embed-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.embed .row{padding:8px 0}
.sec-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chk{display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--kc)}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--crit-soft);border-radius:var(--r);color:var(--ink)}

/* pessoas */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard.done{opacity:.65}
.pcard .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.pcard .nx{font-size:14px;overflow-wrap:anywhere}
.pcard .ob{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.pcard .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}

/* agenda */
.month-h{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px}
.dateb{flex:none;width:48px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;background:var(--surface-2)}
.dateb .d{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.dateb .w{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* indicadores */
.mnav{display:flex;align-items:center;gap:8px}
.mnav .m{font-family:var(--f-display);font-size:19px;font-weight:600;min-width:150px;text-align:center}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.icell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px}
.icell .a{font-weight:700;font-size:14px}
.icell .b{font-size:12px;color:var(--muted)}
.icell input{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
thead th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
tbody tr:last-child td{border-bottom:0}
td.cur{font-weight:700}
.spark{display:block}
.spark .ln{fill:none;stroke:var(--cons);stroke-width:1.6}
.spark .ar{fill:var(--cons-soft);stroke:none}
.spark .dt{fill:var(--cons)}

/* atas */
.ata{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px}
.ata-sec{display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid var(--line)}
.ata-sec h4{margin:0;font-size:15px;display:flex;gap:8px;align-items:baseline}
.ata-sec .tx{white-space:pre-wrap;overflow-wrap:anywhere;max-width:70ch}
.copybox{width:100%;min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:20px}
.sheet h3{font-size:20px;margin-bottom:14px}
.form{display:flex;flex-direction:column;gap:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.err{color:var(--crit);font-size:13px}
@media (max-width:560px){
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:16px 16px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .form .two{grid-template-columns:1fr}
  .sec-b{padding-left:16px}
  .brand h1{font-size:26px}
  .row{flex-wrap:wrap}
  .row .acts{width:100%;justify-content:flex-start}
}
/* layout com barra lateral */
:root{--sb-bg:#0b1d3a;--sb-bg2:#0a1830;--sb-fg:#d5dfef;--sb-mut:#7487a8;--sb-line:rgba(255,255,255,.07);--sb-hover:rgba(255,255,255,.06);--sb-act:#2563eb;--sb-act-fg:#ffffff;--brand-card:#eaf0f9;--brand-ink:#0b1d3a}
.shell{display:flex;align-items:flex-start;min-height:100vh}
.sb{position:sticky;top:0;height:100vh;height:100dvh;width:236px;flex:none;background:linear-gradient(180deg,var(--sb-bg),var(--sb-bg2));color:var(--sb-fg);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding:16px 12px calc(16px + env(safe-area-inset-bottom,0px));transition:width .2s ease,transform .22s ease;z-index:40;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.sb-brand{display:flex;align-items:center;gap:12px;background:var(--brand-card);border-radius:14px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);margin-bottom:8px}
.sb-logo{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#2f6fd6,#163f86);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.sb-logo svg{width:28px;height:28px}
.sb-bt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.sb-bt small{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#4b6188;font-weight:700}
.sb-bt h1{font-size:19px;font-weight:700;color:var(--brand-ink);margin:2px 0 0;white-space:nowrap}
.sb-sec{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--sb-mut);padding:18px 12px 6px;border-top:1px solid var(--sb-line);margin-top:10px}
.sb-sec:first-child{border-top:0;margin-top:0}
.sb-item{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border-radius:10px;color:var(--sb-fg);font-size:14.5px;font-weight:500;cursor:pointer;margin:1px 0;white-space:nowrap}
.sb-l{white-space:normal;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.sb-item .ico{width:19px;height:19px;flex:none;color:var(--ic)}
.sb-item:hover{background:var(--sb-hover);color:#fff}
.sb-item:focus-visible{outline:2px solid #93c5fd;outline-offset:1px}
.sb-item.on{background:var(--sb-act);color:var(--sb-act-fg);font-weight:600;box-shadow:0 4px 14px rgba(37,99,235,.45)}
.sb-item.on .ico{color:var(--sb-act-fg)}
.sb-item .badge,.sb-item .live{margin-left:auto}
.sb-foot{margin-top:auto;padding:16px 12px 0;font-size:11.5px;color:var(--sb-mut);line-height:1.4}
.ico{display:inline-block;vertical-align:middle}
.main{flex:1;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--bg);border-bottom:1px solid var(--line)}
.icon-btn{all:unset;box-sizing:border-box;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink);border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--muted)}
.icon-btn:focus-visible{outline:2px solid var(--bisp);outline-offset:2px}
.icon-btn .ico{width:19px;height:19px}
.top-t{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const ym=s=>s.slice(0,7);
const shiftMonth=(m,n)=>{const [y,mm]=m.split('-').map(Number);const d=new Date(y,mm-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const monthLabel=m=>{const [y,mm]=m.split('-').map(Number);return MESES[mm-1]+' '+y};
function fd(s,wd=true){if(!s)return '—';const d=parse(s);return (wd?WD[d.getDay()]+', ':'')+pad(d.getDate())+'/'+pad(d.getMonth()+1)+(d.getFullYear()!==new Date().getFullYear()?'/'+d.getFullYear():'')}

function errMsg(e){const c=e&&e.code;
  if(c==='invalid_argument')return 'Você não tem permissão para salvar aqui. O bispo pode dar acesso de Editor.';
  if(c==='quota_exceeded')return 'O armazenamento da ala está cheio. Apague registros antigos para continuar.';
  if(c==='resource_exhausted')return 'Muitas alterações seguidas. Aguarde alguns segundos e tente de novo.';
  return 'Não foi possível salvar. Verifique a conexão e tente de novo.'}

/* fila de escrita: uma por documento */
const Q={};
function enqueue(path,fn){const p=(Q[path]||Promise.resolve()).then(fn).catch(e=>{toast(errMsg(e));throw e});Q[path]=p.catch(()=>{});return p}
const dbSet=(p,d)=>enqueue(p,()=>S.db.doc(p).set(d));
const dbUpd=(p,d)=>enqueue(p,()=>S.db.doc(p).update(d));
const dbDel=p=>enqueue(p,()=>S.db.doc(p).delete());
async function dbAdd(col,d){try{return await S.db.collection(col).add(d)}catch(e){toast(errMsg(e));throw e}}

const pend={};
function debounce(key,fn,ms=700){if(pend[key])clearTimeout(pend[key].t);pend[key]={fn,t:setTimeout(()=>{delete pend[key];fn()},ms)}}
function flush(key){const p=pend[key];if(p){clearTimeout(p.t);delete pend[key];p.fn()}}
function flushAll(){Object.keys(pend).forEach(flush)}

const CH_FLOW=['Indicado','Aprovação do bispado','Entrevista','Apoio na sacramental','Designação'];
const CH_SHORT={'Indicado':'Indicados','Aprovação do bispado':'Aprovação do bispado','Entrevista':'Entrevista','Apoio na sacramental':'Apoio na sacramental','Designação':'Designação','Desobrigação':'Desobrigação'};
const chStage=p=>!p.detalhe||p.detalhe==='Proposto'?'Indicado':p.detalhe==='Aprovação da estaca'?'Aprovação do bispado':p.detalhe;
const chOrder=s=>{const i=CH_FLOW.indexOf(s);return i<0?CH_FLOW.length:i};
function chamadosCard(){
  const t=today(),all=S.pessoas.filter(p=>p.tipo==='chamado'),open=all.filter(p=>p.status!=='concluido');
  const isLateP=p=>p.prazo&&p.prazo<t;
  const flow=open.filter(p=>CH_FLOW.includes(chStage(p))),des=open.filter(p=>chStage(p)==='Desobrigação');
  const done30=all.filter(p=>p.status==='concluido'&&(p.atualizadoEm||0)>=Date.now()-30*864e5).length;
  const late=open.filter(isLateP).length;
  const sel=S.chStage;
  const list=(sel?open.filter(p=>chStage(p)===sel):open).sort((a,b)=>chOrder(chStage(a))-chOrder(chStage(b))||byPrazo(a,b));
  const step=s=>{const ps=open.filter(p=>chStage(p)===s),n=ps.length,l=ps.some(isLateP);
    return `<button type="button" class="pipe-s ${n?'has':''} ${sel===s?'on':''}" data-act="ch-stage" data-v="${esc(s)}" aria-pressed="${sel===s}" title="${n} em ${esc(s)}${l?' · com ação vencida':''}">${l?'<span class="late" aria-hidden="true"></span>':''}<span class="n">${n}</span><span class="t">${esc(CH_SHORT[s])}</span></button>`};
  const next=p=>{const i=CH_FLOW.indexOf(chStage(p));return i>=0&&i<CH_FLOW.length-1?CH_FLOW[i+1]:null};
  return `<section class="card" style="display:flex;flex-direction:column;gap:14px">
   <div class="head"><div><h3 style="margin:0">Chamados novos</h3><p class="sub" style="font-size:13px">Da indicação até a designação. Toque numa etapa para filtrar.</p></div><div class="btns"><button type="button" class="btn bisp sm" data-act="new-pessoa" data-tipo="chamado">+ Indicar chamado</button><button type="button" class="btn ghost sm" data-act="ch-all">Ver todos</button></div></div>
   <div class="pipe">${CH_FLOW.map(step).join('')}</div>
   <div class="kpis"><span><b>${flow.length}</b> em andamento</span><span><b>${des.length}</b> desobrigaç${des.length===1?'ão':'ões'} pendente${des.length===1?'':'s'}</span><span class="${late?'crit':''}"><b>${late}</b> com ação vencida</span><span><b>${done30}</b> concluído${done30===1?'':'s'} nos últimos 30 dias</span>${S.chOrgs.length?`<button type="button" class="chip" data-act="go" data-tab="chamados">Lista de chamados · ${chAll().filter(x=>!x.c.pessoa&&!x.c.fixo).length} vagos</button>`:''}${des.length?`<button type="button" class="chip ${sel==='Desobrigação'?'on':''}" data-act="ch-stage" data-v="Desobrigação">Ver desobrigações</button>`:''}</div>
   ${list.length?`<div class="list">${list.slice(0,8).map(p=>{const nx=next(p),st=chStage(p);return `<div class="row"><div class="row-main"><div class="row-t">${esc(p.nome)}</div><div class="row-m"><span>${esc(p.chamado||'Chamado não informado')}</span>${p.proxima?`<span>${esc(p.proxima)}</span>`:''}${p.prazo?`<span class="${isLateP(p)?'late-txt':''}">${fd(p.prazo)}${isLateP(p)?' · vencida':''}</span>`:''}${p.responsavel?`<span>${esc(p.responsavel)}</span>`:''}</div></div>
     <div class="acts"><span class="tag ${st==='Desobrigação'?'tag-warn':'tag-bispado'}">${esc(st)}</span><button type="button" class="btn sm" data-act="ch-adv" data-id="${esc(p.id)}">${nx?'→ '+esc(CH_SHORT[nx]):'Concluir'}</button><button type="button" class="btn ghost sm" data-act="edit-pessoa" data-id="${esc(p.id)}">Editar</button></div></div>`}).join('')}</div>${list.length>8?`<button type="button" class="btn ghost sm" data-act="ch-all" style="align-self:flex-start">Ver mais ${list.length-8}</button>`:''}`
   :`<div class="empty">${sel?'Nenhum chamado nesta etapa.':'Nenhum chamado em andamento. Use “Indicar chamado” para registrar o nome e o chamado e acompanhar cada etapa até a designação.'}</div>`}
  </section>`;
}
function meetCard(t){const M=MEET[t];
  return `<div class="mt ${t}"><span class="tag tag-${t}" style="align-self:flex-start">${t==='bispado'?'Liderança':'Ação conjunta'}</span><h3>${M.l}</h3><p class="q">“${M.q}”</p><p class="who">${M.who} · pauta de 60 min em ${PAUTA[t].length} seções</p>

    <div class="grid2">${['bispado','conselho'].filter(x=>x==='conselho'||S.isBisp).map(x=>{const M=MEET[x];return `<div class="mt ${x}"><h3>${M.l}</h3><p class="q">“${M.q}”</p><p class="who">${M.who}</p><div class="btns"><button type="button" class="btn ${x==='bispado'?'bisp':'cons'}" data-act="start" data-tipo="${x}">Iniciar ${x==='bispado'?'reunião de bispado':'conselho da ala'}</button><button type="button" class="btn" data-act="print" data-tipo="${x}">Imprimir resumo</button></div></div>`}).join('')}</div>`
    :(live.length?'':`<div class="empty">Nenhuma reunião em andamento. Quando o bispado iniciar o Conselho da Ala, ela aparece aqui para acompanhar.</div>`)}
    <section class="card"><h3>Antes de começar</h3><div class="list">${prep.map(([n,l])=>`<div class="row" style="padding:8px 0"><span class="num" style="font-weight:700;min-width:28px">${n}</span><span>${l}</span></div>`).join('')}</div></section>
  </div>`;
}
function noteVal(m,k){const key=m.id+'|'+k,srv=(m.notas||{})[k]||'';if(key in S.local){if(S.local[key]===srv)delete S.local[key];else return S.local[key]}return srv}

function embedHTML(e,m){

  if(e==='fin'){if(!S.isBisp)return '';const p=perOf(t),C=finCalc(p);
    const h=`<div class="embed-h"><span>Financeiro · ${perShort(p)}</span><span class="btns">${C?`<button type="button" class="btn ghost sm" data-act="fin-new" data-per="${p}">+ Despesa</button>`:''}<button type="button" class="btn ghost sm" data-act="go" data-tab="financeiro">Abrir</button></span></div>`;

/* ---------- Membros ---------- */
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const stripM=m=>{const r={...m};delete r._c;return r};
const newMemId=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function ageOf(m){
  if(m.nascimento&&/^\d{4}-\d{2}-\d{2}$/.test(m.nascimento)){const b=parse(m.nascimento),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n.getMonth()<b.getMonth()||(n.getMonth()===b.getMonth()&&n.getDate()<b.getDate()))a--;return a}
  const i=parseInt(m.idade,10);return isFinite(i)?i:null}
const ageGroup=m=>{const a=ageOf(m);return a==null?'':a<12?'criancas':a<18?'jovens':'adultos'};
function pessoaIndex(){const o={};S.pessoas.filter(p=>p.status!=='concluido').forEach(p=>{const k=norm(p.nome);(o[k]=o[k]||[]).push(p)});return o}
function mFiltered(){
  const pi=pessoaIndex(),ci=chIndex(),q=norm(S.mSearch),qd=S.mSearch.replace(/\D/g,''),f=S.mFilter,sx=S.mSex;
  return S.mem.filter(m=>{
    if(sx!=='todos'&&m.sexo!==sx)return false;
    if(f==='adultos'||f==='jovens'||f==='criancas'){if(ageGroup(m)!==f)return false}
    else if(f==='semchamado'){if(ageGroup(m)!=='adultos'||(m.chamado||'').trim()||ci[norm(m.nome)])return false}
    else if(f==='acomp'){if(!pi[norm(m.nome)])return false}
    if(q&&!(norm(m.nome).includes(q)||norm(m.chamado||(ci[norm(m.nome)]||[]).join(' ')).includes(q)||(qd.length>=3&&String(m.telefone||'').replace(/\D/g,'').includes(qd))))return false;
    return true})}
function mList(){
  const L=mFiltered(),pi=pessoaIndex(),ci=chIndex(),meta=S.memMeta||{},temCh=meta.temChamado||S.chOrgs.length>0;
  if(!L.length)return `<div class="empty" style="margin-block:12px">Ninguém encontrado com esses filtros.</div>`;
  return `<div class="list">${L.slice(0,S.mLimit).map(m=>{const a=ageOf(m),ps=pi[norm(m.nome)]||[];
    return `<div class="row"><div class="row-main"><div class="row-t">${esc(m.nome)}</div>
     <div class="row-m">${a!=null?`<span>${a} anos</span>`:''}${m.sexo?`<span>${m.sexo==='M'?'Masculino':'Feminino'}</span>`:''}${m.telefone?`<span>${esc(m.telefone)}</span>`:''}${(()=>{const ch=m.chamado||(ci[norm(m.nome)]||[]).join(', ');return temCh||ch?`<span>${ch?esc(ch):'Sem chamado'}</span>`:''})()}</div>
     ${ps.length?`<div class="chips" style="margin-top:6px">${ps.map(p=>`<span class="tag tag-bispado">${esc(p.tipo==='chamado'?'Chamado: '+chStage(p):PT[p.tipo].l)}</span>`).join('')}</div>`:''}</div>
     <div class="acts"><button type="button" class="btn ghost sm" data-act="m-acomp" data-id="${esc(m.id)}">Acompanhar</button><button type="button" class="btn ghost sm" data-act="m-chamado" data-id="${esc(m.id)}">Indicar chamado</button><button type="button" class="btn sm" data-act="m-edit" data-id="${esc(m.id)}">Editar</button></div></div>`}).join('')}</div>
   ${L.length>S.mLimit?`<button type="button" class="btn ghost sm" data-act="m-more" style="margin-top:8px">Mostrar mais ${Math.min(60,L.length-S.mLimit)} de ${L.length-S.mLimit}</button>`:''}`}

  if(!S.memReady)return '<div class="empty">Carregando a lista de membros…</div>';

  const head=`<div class="head"><div><h2>Membros</h2><p class="sub">Lista da ala para acompanhamento e indicação de chamados. Somente o bispado vê esta página.</p></div><div class="btns"><button type="button" class="btn bisp" data-act="m-import">Importar lista</button><button type="button" class="btn" data-act="m-new">+ Membro</button></div></div>`;

  if(!M.length)return `<div class="stack">${head}${note}<div class="empty" style="display:flex;flex-direction:column;gap:14px;align-items:center;padding:28px 16px"><b style="color:var(--ink)">Nenhum membro cadastrado ainda</b>

  const cnt=g=>M.filter(m=>ageGroup(m)===g).length;

   </div>`}
   <section class="card"><h3>Como funciona</h3><ol class="steps"><li>O líder da organização toca em “Nova solicitação de atividade” e preenche o modelo: data, local, reserva da capela, propósito, custo e líderes de apoio.</li><li>A solicitação entra em <b style="color:var(--s-crit)">Aguardando aprovação</b> e o bispado é avisado na Visão geral.</li><li>O bispado aprova, pede ajustes ou não aprova, com um comentário. Atividades aprovadas ficam em <b style="color:var(--s-exc)">verde</b> e podem ir direto para a Agenda da ala.</li><li>Envie com pelo menos 2 semanas de antecedência e reserve a capela antes de enviar.</li><li>Depois da atividade, abra a atividade aprovada e toque em “Enviar feedback”: conte o sucesso alcançado e quantos membros e não membros participaram.</li></ol></section>
  </div>`;
}

function estStats(E){if(!E)return null;const alas=(E.alas||[]).map(a=>({...a,matriculados:+a.matriculados||0,potencial:+a.potencial||0,taxa:pctOf(+a.matriculados||0,+a.potencial||0)}));

  const rank=[...alas].sort((a,b)=>b.taxa-a.taxa),me=alas.find(a=>isMe(a.nome)),pos=me?rank.indexOf(me)+1:null;
  return {E,alas,sm,sp,media,me,pos,n:alas.length}}

let SIR=null;
const SIR_F=[['nome','Nome do aluno *',/nome|aluno|name/],['tipo','Tipo (Seminário ou Instituto)',/^tipo|programa|curso/],['situacao','Situação',/situa|status/],['aulas','Aulas a recuperar',/recuperar/],['avaliacao','Avaliação',/avalia/],['leitura','Leitura',/leitura|reading/],['freq','Frequência %',/freq|presen/]];
function parsePct(v){let s=String(v==null?'':v).trim();if(!s)return null;const hp=s.includes('%');s=s.replace('%','').replace(/\s/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');let n=Number(s);if(!isFinite(n))return null;if(!hp&&n>0&&n<=1&&/[.,]/.test(String(v)))n*=100;return Math.round(n)}
const avalFeita=a=>{const n=norm(a);return !!n&&!/nao|pend/.test(n)&&/realiz|feit|sim|ok|conclu/.test(n)};
function sitCompute(s){const f=s.freq==null?0:s.freq,l=s.leitura==null?0:s.leitura,av=avalFeita(s.avaliacao);if(f>=75&&l>=75&&av)return 'credito';if(f<75&&!av)return 'risco';return 'pendencia'}
function normSit(v){const n=norm(v);if(/credit|conclu|aprov/.test(n))return 'credito';if(/pend/.test(n))return 'pendencia';if(/risco/.test(n))return 'risco';return null}
function sirGuess(rows){let h=0;for(let i=0;i<Math.min(10,rows.length);i++){if(rows[i].filter(c=>SIR_F.some(f=>f[2].test(norm(c)))).length>=3){h=i;break}}
  const H=rows[h].map(norm),map={},used=new Set();SIR_F.forEach(([k,,rx])=>{const i=H.findIndex((c,j)=>!used.has(j)&&rx.test(c));map[k]=i>=0?i:null;if(i>=0)used.add(i)});return {h,map}}
function sirRecords(){const M=SIR.map,out=[];const get=(r,k)=>M[k]==null?'':String(r[M[k]]==null?'':r[M[k]]).trim();
  SIR.rows.slice(SIR.h+1).forEach(r=>{const nome=get(r,'nome').replace(/\s+/g,' ');if(!nome||/^\d+$/.test(nome))return;
    const t=get(r,'tipo'),s={nome,tipo:progOf(t)?PROG[progOf(t)].l:t,aulas:get(r,'aulas')===''?null:parseInt(get(r,'aulas'),10),avaliacao:get(r,'avaliacao'),leitura:parsePct(get(r,'leitura')),freq:parsePct(get(r,'freq'))};
    if(!isFinite(s.aulas))s.aulas=null;s.situacao=normSit(get(r,'situacao'))||sitCompute(s);out.push(s)});return out}
function openSirImport(){const m=new Date().getMonth();SIR={rows:null,h:0,map:{},data:today(),semestre:(m<6?'1º':'2º')+' semestre '+new Date().getFullYear(),busy:false};$('#sheet').classList.add('wide');$('#modal').hidden=false;sirRender()}

    else{const buf=await file.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);if(t.includes(String.fromCharCode(0xFFFD)))t=new TextDecoder('windows-1252').decode(buf);sirSetRows(textToRows(t))}}

   <div class="tscroll imp-prev"><table><thead><tr><th>Aluno</th><th>Tipo</th><th>Situação</th><th>Freq.</th><th>Leitura</th><th>Aulas</th><th>Avaliação</th></tr></thead><tbody>${recs.slice(0,6).map(s=>`<tr><td>${esc(s.nome)}</td><td>${esc(s.tipo||'—')}</td><td><span class="sit sit-${s.situacao}">${SIT[s.situacao]}</span></td><td>${s.freq!=null?s.freq+'%':'—'}</td><td>${s.leitura!=null?s.leitura+'%':'—'}</td><td>${s.aulas!=null?s.aulas:'—'}</td><td>${esc(s.avaliacao||'—')}</td></tr>`).join('')||'<tr><td colspan="7">Nenhum aluno encontrado. Confira a coluna do nome.</td></tr>'}</tbody></table></div>
   <p class="sub" style="font-size:13px"><b>${recs.length}</b> alunos · ${c('credito')} com crédito · ${c('pendencia')} com pendência · ${c('risco')} em risco${S.sirAlunos.some(a=>a.data===SIR.data)?' · <b class="late-txt">já existe um relatório nesta data e ele será substituído</b>':''}</p>

  if(foc){const el=document.getElementById(foc);if(el)el.focus()}}
$('#modal').addEventListener('change',e=>{if(!SIR)return;const t=e.target;
  if(t.id==='sir-file'){sirReadFile(t.files&&t.files[0]);return}
  if(t.dataset.sirMap){SIR.map[t.dataset.sirMap]=t.value===''?null:Number(t.value);sirRender();return}
  if(t.id==='sir-h'){SIR.h=Number(t.value);const H=SIR.rows[SIR.h].map(norm),used=new Set();SIR_F.forEach(([k,,rx])=>{const i=H.findIndex((c,j)=>!used.has(j)&&rx.test(c));SIR.map[k]=i>=0?i:null;if(i>=0)used.add(i)});sirRender();return}

async function sirDoImport(){if(!SIR||SIR.busy)return;const recs=sirRecords();if(!recs.length)return sirErr('Nenhum aluno para importar.');if(!SIR.data)return sirErr('Informe a data do relatório.');

/* ---------- Financeiro ---------- */
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const money=v=>BRL.format(Number(v)||0);
const r2=n=>Math.round((Number(n)||0)*100)/100;
function parseMoney(s){s=String(s==null?'':s).replace(/R\$|\s| /g,'');if(!s)return NaN;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=Number(s);return isFinite(n)?r2(n):NaN}
const moneyIn=v=>v==null||v===''?'':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const perOf=s=>{const [y,m]=s.split('-').map(Number);return y+'-T'+(Math.floor((m-1)/3)+1)};
const perParts=p=>{const [y,t]=p.split('-T').map(Number);return {y,t}};
const perLabel=p=>{const {y,t}=perParts(p);return t+'º trimestre de '+y};
const perShort=p=>{const {y,t}=perParts(p);return t+'º tri '+y};
const perMonths=p=>{const {t}=perParts(p);return [0,1,2].map(i=>MESES[(t-1)*3+i])};
const perMesesTxt=p=>{const m=perMonths(p);return m[0]+', '+m[1]+' e '+m[2]};
const perAbrev=p=>perMonths(p).map(x=>x.slice(0,3)).join(', ');
const perShift=(p,n)=>{let {y,t}=perParts(p);t+=n;while(t>4){t-=4;y++}while(t<1){t+=4;y--}return y+'-T'+t};
const perRange=p=>{const {y,t}=perParts(p);return [iso(new Date(y,(t-1)*3,1)),iso(new Date(y,t*3,0))]};
const DEF_LINHAS=['Sociedade de Socorro','Quórum de Élderes','Rapazes','Moças','Primária','Jovens Adultos Solteiros','Obra Missionária','Seminário'];
const newLineId=n=>(String(n).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,20)||'linha')+'-'+Math.random().toString(36).slice(2,6);
const curPer=()=>S.finPer||perOf(today());
function finCalc(p){
  const P=S.fin[p];if(!P)return null;
  const L=S.lanc.filter(x=>x.periodo===p),g={};
  L.forEach(x=>g[x.linha]=r2((g[x.linha]||0)+(Number(x.valor)||0)));
  const linhas=[...(P.linhas||[])];
  Object.keys(g).forEach(id=>{if(!linhas.some(l=>l.id===id))linhas.push({id,nome:'Linha removida',valor:0,orfa:true})});
  const rows=linhas.map(l=>{const orc=r2(l.valor),gasto=g[l.id]||0,pct=orc>0?gasto/orc*100:(gasto>0?Infinity:0);
    return {...l,orc,gasto,saldo:r2(orc-gasto),pct,st:(orc<=0&&gasto>0)?'crit':fst(pct)}});
  const recebido=r2(P.recebido),distribuido=r2(rows.reduce((s,r)=>s+r.orc,0)),gasto=r2(rows.reduce((s,r)=>s+r.gasto,0));
  return {P,L,rows,recebido,distribuido,gasto,saldo:r2(recebido-gasto),naoDistr:r2(recebido-distribuido)};
}
const lineName=(p,id)=>{const P=S.fin[p];const l=P&&(P.linhas||[]).find(x=>x.id===id);return l?l.nome:'Linha removida'};
const FST={exc:['Excelente','até 50%'],bom:['Bom','51% a 80%'],norm:['Normal','81% a 100%'],crit:['Crítico','acima de 100%']};
const fst=pct=>pct>100?'crit':pct>80?'norm':pct>50?'bom':'exc';
function ring(pct,st,txt){const r=24,c=2*Math.PI*r,v=Math.max(0,Math.min(100,pct||0));return `<svg class="ring" width="62" height="62" viewBox="0 0 62 62" aria-hidden="true"><circle class="rg-t" cx="31" cy="31" r="${r}"/><circle class="rg-a b-${st}" cx="31" cy="31" r="${r}" stroke-dasharray="${(v/100*c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 31 31)"/><text x="31" y="35" text-anchor="middle" class="rg-x">${txt||Math.round(pct||0)+'%'}</text></svg>`}
function donut(C,lbl='recebido'){const r=58,c=2*Math.PI*r,tot=Math.max(C.recebido,C.gasto,1),g=Math.min(C.gasto,tot)/tot,ex=C.saldo<0;const ga=(g*c).toFixed(1),sa=((1-g)*c).toFixed(1);
  return `<svg width="170" height="170" viewBox="0 0 170 170" role="img" aria-label="Gasto ${money(C.gasto)} e saldo ${money(C.saldo)}"><circle class="rg-t" cx="85" cy="85" r="${r}" style="stroke-width:22"/><circle class="b-${ex?'crit':'norm'}" cx="85" cy="85" r="${r}" fill="none" style="stroke-width:22" stroke-dasharray="${ga} ${c.toFixed(1)}" transform="rotate(-90 85 85)"><title>Gasto ${money(C.gasto)}</title></circle>${!ex?`<circle class="b-bom" cx="85" cy="85" r="${r}" fill="none" style="stroke-width:22" stroke-dasharray="${sa} ${c.toFixed(1)}" stroke-dashoffset="-${ga}" transform="rotate(-90 85 85)"><title>Saldo ${money(C.saldo)}</title></circle>`:''}<text x="85" y="80" text-anchor="middle" class="dn-l">${lbl}</text><text x="85" y="100" text-anchor="middle" class="dn-v">${kfmt(C.recebido)}</text></svg>`}

  if(L.length)t+='\n\nLANÇAMENTOS\n'+L.map(x=>`${fd(x.data,false)} · ${lineName(p,x.linha)} · ${x.descricao}${x.nota?' (nota '+x.nota+')':''} · ${money(x.valor)}`).join('\n');

function lancForm(x,linhaPre,per){

  const [a,b]=perRange(p),t=today(),def=t<a?a:t>b?b:t;
  const opts=C.rows.filter(r=>!r.orfa||(x&&x.linha===r.id)).map(r=>[r.id,r.nome+' · saldo '+money(r.saldo)]);
  openForm({title:(x?'Editar despesa':'Lançar despesa')+' · '+perParts(p).t+'º trimestre ('+perAbrev(p)+' '+perParts(p).y+')',
    fields:[{k:'valor',l:'Valor (R$)',type:'text',req:1,ph:'0,00',im:'decimal'},{k:'linha',l:'Organização',type:'select',opts},
      {k:'descricao',l:'Descrição',type:'text',req:1,ph:'Ex.: Lanche da atividade dos rapazes'},
      {row:[{k:'data',l:'Data da nota ('+perAbrev(p)+')',type:'date',req:1,min:a,max:b},{k:'nota',l:'Nº da nota',type:'text',ph:'Opcional'}]},

    onSave:async v=>{const val=parseMoney(v.valor);
      if(!(val>0))throw {msg:'Informe um valor maior que zero, por exemplo 125,50.'};
      if(v.data<a||v.data>b)throw {msg:`A data precisa estar dentro do ${perLabel(p)} (${fd(a,false)} a ${fd(b,false)}). Para outro trimestre, troque o trimestre no topo da página.`};

function bTot(){const box=$('#b-tot');if(!box)return;const rec=parseMoney($('#b-rec').value)||0;let sum=0;document.querySelectorAll('#b-lines .b-v').forEach(i=>sum+=parseMoney(i.value)||0);sum=r2(sum);const d=r2(rec-sum);
  box.innerHTML=`<div class="btot"><span>Distribuído</span><span class="money">${money(sum)}</span></div><div class="btot"><span>${d>=0?'Sem destino':'Acima do recebido'}</span><span class="money ${d<0?'late-txt':''}">${money(Math.abs(d))}</span></div>`}

document.addEventListener('submit',async e=>{if(e.target.id!=='bform')return;e.preventDefault();if(!BFORM)return;
  const er=$('#b-err'),fail=m=>{er.textContent=m;er.hidden=false};
  const recRaw=$('#b-rec').value.trim(),rec=parseMoney(recRaw);if(!recRaw||!(rec>=0))return fail('Informe o valor recebido no trimestre, por exemplo 9.600,00.');
  const linhas=[];let bad=null;
  document.querySelectorAll('#b-lines .budget-row').forEach(row=>{const nome=row.querySelector('.b-n').value.trim(),raw=row.querySelector('.b-v').value.trim(),v=raw?parseMoney(raw):0;

    if(!nome)bad='Dê um nome a cada linha com valor.';else if(!(v>=0))bad='Confira o valor de “'+nome+'”.';
    linhas.push({id:row.dataset.id,nome,valor:v})});
  if(bad)return fail(bad);if(!linhas.length)return fail('Adicione pelo menos uma organização.');
  const b=$('#b-save');b.disabled=true;b.textContent='Salvando…';
  try{await dbSet(CONF+'/financeiro/'+BFORM.p,{periodo:BFORM.p,recebido:rec,linhas,atualizadoEm:Date.now()});closeForm();toast('Orçamento salvo')}catch(x){b.disabled=false;b.textContent='Salvar orçamento'}});

function drawFinChart(){
  drawOrgChart();drawFinAnnual();drawLancOrg();
  const box=document.getElementById('fin-chart');if(!box)return;
  const p=box.dataset.p,C=finCalc(p);if(!C){box.innerHTML='';return}
  const W=Math.max(280,box.clientWidth),H=220,ml=62,mr=14,mt=16,mb=26,iw=W-ml-mr,ih=H-mt-mb;
  const [a,b]=perRange(p),A=parse(a),days=Math.round((parse(b)-A)/864e5)+1,idx=s=>Math.round((parse(s)-A)/864e5);
  const per=new Array(days).fill(0);let maxI=-1;
  C.L.forEach(x=>{const i=idx(x.data);if(i>=0&&i<days){per[i]+=Number(x.valor)||0;maxI=Math.max(maxI,i)}});
  const cum=[];per.reduce((s,v,i)=>(cum[i]=r2(s+v)),0);
  const t=today();let last=t<a?-1:t>b?days-1:idx(t);last=Math.max(last,maxI);
  const raw=Math.max(C.recebido,cum[days-1],1)*1.08/4,pw=10**Math.floor(Math.log10(raw)),f=raw/pw;
  const step=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*pw,top=step*Math.ceil(raw*4/step);
  const X=i=>ml+(days>1?i/(days-1):0)*iw,Y=v=>mt+ih-(v/top)*ih;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
  for(let v=0;v<=top+1e-6;v+=step)s+=`<line class="fc-grid" x1="${ml}" x2="${ml+iw}" y1="${Y(v)}" y2="${Y(v)}"/><text class="fc-ax" x="${ml-8}" y="${Y(v)+4}" text-anchor="end">${axMoney(v)}</text>`;
  const {y,t:tq}=perParts(p);for(let m=0;m<3;m++){const i=idx(iso(new Date(y,(tq-1)*3+m,1)));s+=`<text class="fc-ax" x="${X(i)+(m?0:2)}" y="${H-6}">${MESES[(tq-1)*3+m].slice(0,3)}</text>`}
  if(C.recebido>0)s+=`<line class="fc-ref" x1="${ml}" x2="${ml+iw}" y1="${Y(C.recebido)}" y2="${Y(C.recebido)}"/><text class="fc-ax" x="${ml+iw}" y="${Y(C.recebido)-6}" text-anchor="end">Recebido ${money(C.recebido)}</text>`;
  if(last>=0){let d=`M${X(0)},${Y(0)}`;for(let i=0;i<=last;i++)d+=` L${X(i)},${Y(i?cum[i-1]:0)} L${X(i)},${Y(cum[i])}`;
    s+=`<path class="fc-area" d="${d} L${X(last)},${Y(0)} Z"/><path class="fc-line" d="${d}"/>`;
    const ex=X(last),ey=Y(cum[last]);s+=`<circle class="fc-dot" cx="${ex}" cy="${ey}" r="4.5"/><text class="fc-val" x="${ex>W-120?ex-8:ex+8}" y="${ey-9}" text-anchor="${ex>W-120?'end':'start'}">${money(cum[last])}</text>`}
  s+=`<line class="fc-x" id="fc-x" y1="${mt}" y2="${mt+ih}" visibility="hidden"/><circle class="fc-dot" id="fc-hd" r="4.5" visibility="hidden"/><rect x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent" id="fc-hit"/></svg><div class="fc-tip" id="fc-tip" hidden></div>`;
  box.innerHTML=s;
  if(last<0)return;
  const hit=box.querySelector('#fc-hit'),xl=box.querySelector('#fc-x'),hd=box.querySelector('#fc-hd'),tip=box.querySelector('#fc-tip');
  const show=e=>{const r=box.getBoundingClientRect(),i=Math.max(0,Math.min(last,Math.round((e.clientX-r.left-ml)/iw*(days-1))));
    const x=X(i),yy=Y(cum[i]);xl.setAttribute('x1',x);xl.setAttribute('x2',x);xl.setAttribute('visibility','visible');hd.setAttribute('cx',x);hd.setAttribute('cy',yy);hd.setAttribute('visibility','visible');
    const dt=new Date(A);dt.setDate(dt.getDate()+i);
    tip.innerHTML=`<b>${pad(dt.getDate())}/${pad(dt.getMonth()+1)}</b> · acumulado ${money(cum[i])}${per[i]?'<br>no dia: '+money(per[i]):''}`;
    tip.hidden=false;tip.style.left=Math.max(80,Math.min(W-80,x))+'px';tip.style.top=Math.max(0,yy-52)+'px'};
  hit.addEventListener('pointermove',show);hit.addEventListener('pointerdown',show);
  hit.addEventListener('pointerleave',()=>{tip.hidden=true;xl.setAttribute('visibility','hidden');hd.setAttribute('visibility','hidden')});
}

  switch(a){
    case 'go':go(d.tab);break;
    case 'toggle-sec':S.open.has(d.sec)?S.open.delete(d.sec):S.open.add(d.sec);render();break;
    case 'start':startMeeting(d.tipo);break;
    case 'start-go':S.choosing=true;S.meetingId=null;go('reuniao');break;
    case 'resume':S.meetingId=d.id;S.choosing=false;S.confirm=null;go('reuniao');break;
    case 'switch':S.meetingId=null;S.choosing=true;S.confirm=null;render();break;

    case 'e-del':{const r=el.closest('.e-row,.h-row');if(r)r.remove();break}
    case 'imp-del':{if(el.dataset.armed){dbDel(CONF+'/sir/'+d.id).then(()=>toast('Importação excluída')).catch(()=>{})}else{el.dataset.armed='1';el.textContent='Confirmar exclusão';el.classList.remove('ghost');el.classList.add('danger')}break}
    case 'm-import':openImport();break;
    case 'm-new':memberForm(null);break;
    case 'm-edit':{const m=S.mem.find(x=>x.id===d.id);if(m)memberForm(m);break}
    case 'm-acomp':{const m=S.mem.find(x=>x.id===d.id);if(m)pessoaForm(null,'acomp',{nome:m.nome});break}
    case 'm-chamado':{const m=S.mem.find(x=>x.id===d.id);if(m)pessoaForm(null,'chamado',{nome:m.nome});break}
    case 'm-more':S.mLimit+=60;{const b=$('#m-list');if(b)b.innerHTML=mList()}break;
    case 'm-f':S.mFilter=d.v;S.mLimit=60;render();break;
    case 'm-sex':S.mSex=d.v;S.mLimit=60;render();break;
    case 'imp-read':impReadPaste();break;
    case 'imp-back':if(IMP){IMP.rows=null;impRender()}break;
    case 'imp-go':doImport();break;
    case 'ch-stage':S.chStage=S.chStage===d.v?null:d.v;render();break;
    case 'ch-all':S.cdView=S.chStage==='Desobrigação'?'desob':'novos';go('chamdes');break;
    case 'cd-view':S.cdView=d.v;render();break;
    case 'new-des':pessoaForm(null,'chamado',{detalhe:'Desobrigação'});break;
    case 'des-adv':{const p=S.pessoas.find(x=>x.id===d.id);if(!p)break;const i=+p.dpasso||0;
      const body=i<D_FLOW.length-1?{dpasso:i+1,atualizadoEm:Date.now()}:{dpasso:D_FLOW.length,status:'concluido',atualizadoEm:Date.now()};
      dbUpd(CONF+'/pessoas/'+p.id,body).then(()=>toast(body.status?p.nome+': desobrigação concluída':p.nome+': '+D_FLOW[i].toLowerCase()+' ✓')).catch(()=>{});break}
    case 'ch-adv':{const p=S.pessoas.find(x=>x.id===d.id);if(!p)break;const i=CH_FLOW.indexOf(chStage(p));
      const body=i>=0&&i<CH_FLOW.length-1?{detalhe:CH_FLOW[i+1],atualizadoEm:Date.now()}:{status:'concluido',atualizadoEm:Date.now()};
      dbUpd(CONF+'/pessoas/'+p.id,body).then(()=>{toast(body.detalhe?p.nome+': '+body.detalhe:p.nome+': chamado concluído');if(!body.detalhe&&p.cargoRef)applyPending(p.cargoRef.org,p.cargoRef.cargo,p.id)}).catch(()=>{});break}
    case 'print':printOpen(d.tipo,d.ata);break;
    case 'atv-new':atvForm(null);break;
    case 'n-view':S.nView=d.v;render();break;
    case 'n-area':S.nArea=d.v;render();break;
    case 'n-f':S.nF=d.v;render();break;
    case 'n-ev':natalEvForm();break;
    case 'n-tk':natalTkForm(d.id?S.ntk.find(x=>x.id===d.id):null,d.area);break;
    case 'n-gs':natalGsForm(d.id?S.ngs.find(x=>x.id===d.id):null);break;
    case 'n-idea':natalAddIdea(+d.i);break;
    case 'n-idea-all':natalAddArea(d.area);break;
    case 'n-orc-fin':natalUseFin();break;
    case 'atv-fb':atvFeedback(d.id);break;
    case 'atv-open':atvOpen(d.id);break;
    case 'atv-edit':{const a=S.atv.find(x=>x.id===d.id);if(a)atvForm(a);break}
    case 'atv-f':S.atvF=d.v;render();break;
    case 'atv-dec':atvDecide(d.id,d.v);break;
    case 'atv-del':{if(el.dataset.armed){dbDel('atividades/'+d.id).then(()=>{closeForm();toast('Solicitação excluída')}).catch(()=>{})}else{el.dataset.armed='1';el.textContent='Confirmar exclusão';el.classList.remove('ghost');el.classList.add('danger')}break}
    case 'chg-open':chgOpen(d.org,d.id);break;
    case 'chg-apply':applyPending(d.org,d.id);break;
    case 'chg-add':chgAddCargo(d.org);break;
    case 'chg-addorg':chgAddOrg();break;
    case 'chg-f':S.chF=d.v;render();break;
    case 'chg-vagar':{if(el.dataset.armed){chgVagar()}else{el.dataset.armed='1';el.textContent='Confirmar: deixar vago';el.classList.remove('ghost');el.classList.add('danger')}break}
    case 'chg-del':{if(el.dataset.armed){chgDelete()}else{el.dataset.armed='1';el.textContent='Confirmar exclusão';el.classList.remove('ghost');el.classList.add('danger')}break}
    case 'chg-cancel':chgCancelPending();break;
    case 'fview':S.finView=d.v;render();window.scrollTo(0,0);break;
    case 'fyear':S.finYear=(S.finYear||new Date().getFullYear())+Number(d.v);render();break;
    case 'fl-sort':S.fl.dir=S.fl.sort===d.v&&S.fl.dir==='desc'?'asc':'desc';S.fl.sort=d.v;{const t=$('#fl-table');if(t)t.innerHTML=flTable()}break;
    case 'fl-clear':S.fl={ano:'',tri:'',org:'',de:'',ate:'',q:'',sort:'data',dir:'desc'};render();break;
    case 'fl-csv':flCSV();break;
    case 'fchart':S.finChart=d.v;render();break;
    case 'fper-cur':S.finPer=null;S.finLine='todas';render();break;
    case 'fper':S.finPer=perShift(curPer(),Number(d.v));S.finLine='todas';render();break;

    case 'fin-new':lancForm(null,d.linha,d.per);break;
    case 'fin-edit':{const x=S.lanc.find(l=>l.id===d.id);if(x)lancForm(x);break}

    case 'fin-copy':{const P=S.fin[d.from];if(P)budgetForm(curPer(),{recebido:P.recebido,linhas:(P.linhas||[]).map(l=>({...l}))});break}
    case 'fin-report':{const txt=finReport(curPer());if(!txt)break;const fb=()=>{const w=$('#fin-copy-fb'),bx=$('#fin-copy-box');if(w&&bx){bx.value=txt;w.hidden=false;bx.focus();bx.select()}};

    case 'b-add':{const box=$('#b-lines');if(!box||!BFORM)break;const id=newLineId('linha');box.insertAdjacentHTML('beforeend',bRow({id,nome:'',valor:''},BFORM.used));const n=document.getElementById('bn-'+id);if(n)n.focus();break}
    case 'b-del':{const row=el.closest('.budget-row');if(row){row.remove();bTot()}break}
    case 'm-close':closeForm();break;
    case 'm-del':{if(el.dataset.armed){try{await FORM.onDelete();closeForm();toast('Excluído')}catch(x){}}else{el.dataset.armed='1';el.textContent='Confirmar exclusão';el.classList.remove('ghost');el.classList.add('danger')}break}
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='tratado'){const m=curMeeting();if(!m)return;const k=el.dataset.sec;const P=PAUTA[m.tipo];
    dbUpd(ataCol(m.tipo)+'/'+m.id,{tratados:{[k]:el.checked}}).catch(()=>{});
    if(el.checked){S.open.delete(k);const i=P.findIndex(s=>s.k===k);if(P[i+1])S.open.add(P[i+1].k)}
    el.blur();schedule();return}
  if(el.dataset.act==='pdone'){S.pDone=el.checked;render();return}
  if(el.dataset.act==='n-done'){dbUpd('natal-tarefas/'+el.dataset.id,{status:el.checked?'concluida':'pendente',atualizadoEm:Date.now()}).catch(()=>{});return}
  if(el.dataset.ind){saveInd(el.dataset.ind,el.value.trim());return}
});
view.addEventListener('input',e=>{
  const el=e.target,m=curMeeting();if(!m||!W())return;
  let k=el.dataset.note;if(el.id==='m-pres')k='_pres';if(!k)return;
  const val=el.value,path=ataCol(m.tipo)+'/'+m.id;S.local[m.id+'|'+k]=val;
  debounce(k==='_pres'?'pres':'note'+k,()=>dbUpd(path,{notas:{[k]:val}}).catch(()=>{}));
});

/* ---------- inicialização ---------- */
function sub(path,set){S.db.collection(path).onSnapshot(snap=>{set(snap.docs.map(x=>({...x.data(),id:x.id})));S.ready=true;$('#sync').textContent='Dados sincronizados';schedule()},e=>{if(e&&e.code==='revoked')S.err='O acesso a este sistema foi alterado. Recarregue a página.';else if(e&&e.code==='resource_exhausted')S.err='Conexão sobrecarregada. Recarregue a página.';schedule()})}
async function init(){
  const d=new Date();$('#today').innerHTML=`<b>${WD[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}</b>`;
  let t=(location.hash||'').slice(1);if(!t){try{t=localStorage.getItem('ab-tab')||''}catch(e){}}
  if(TABS.some(x=>x.id===t))S.tab=t;
  render();
  const C=window.claude;
  if(!C||!C.use){S.err='Abra este sistema pelo link do claude.ai para ver e salvar os dados da ala.';$('#sync').textContent='Sem conexão com os dados';render();return}
  const [db,user]=await Promise.all([C.use('db'),C.use('user')]);
  if(!db){S.err='Os dados da ala não estão disponíveis nesta visualização. Entre com sua conta do claude.ai e abra o link recebido do bispo.';$('#sync').textContent='Sem conexão com os dados';render();return}
  S.db=db;
  if(user){try{S.isBisp=!!(await user.canEdit())}catch(e){}try{const cw=await user.can('data.write');S.canWrite=cw!==false}catch(e){}}else{S.isBisp=true}
  sub('natal',x=>{S.nev=x.find(d=>d.id==='evento')||null;S.nReady=true});sub('natal-tarefas',x=>S.ntk=x);sub('natal-gastos',x=>S.ngs=x);
  sub('atividades',x=>{S.atv=x;S.atvReady=true});sub('aprovacoes',x=>{const o={};x.forEach(r=>o[r.id]=r);S.aprov=o});
  sub('designacoes',x=>S.desig=x);sub('agenda',x=>S.agenda=x);sub('atas',x=>S.atas=x);
  sub('indicadores',x=>{const o={};x.forEach(r=>o[r.id]=r);S.ind=o});
  if(S.isBisp){sub(CONF+'/chamados',docs=>{S.chOrgs=[...docs].sort((a,b)=>(a.ordem||0)-(b.ordem||0));S.chReady=true});
    sub(CONF+'/sir',docs=>{const al=[],es={seminario:[],instituto:[]};docs.forEach(d=>{if(d.id.startsWith('alunos-'))al.push(d);else if(d.id.startsWith('estaca-')&&es[d.programa])es[d.programa].push(d)});
      const bd=(a,b)=>String(b.data||'').localeCompare(String(a.data||''));al.sort(bd);es.seminario.sort(bd);es.instituto.sort(bd);S.sirAlunos=al;S.sirEst=es;S.sirReady=true});
    sub(CONF+'/membros',docs=>{const ch={};let meta=null;docs.forEach(d=>{if(d.id==='meta')meta=d;else if(d.id.startsWith('lista-'))ch[d.id]=Array.isArray(d.membros)?d.membros:[]});
      S.memChunks=ch;S.memMeta=meta;S.mem=Object.entries(ch).flatMap(([c,a])=>a.map(m=>({...m,_c:c}))).sort((a,b)=>String(a.nome).localeCompare(String(b.nome),'pt'));S.memReady=true});
    sub(CONF+'/financeiro',x=>{const o={};x.forEach(r=>o[r.id]=r);S.fin=o;S.finReady=true});sub(CONF+'/lancamentos',x=>S.lanc=x);
    sub(CONF+'/designacoes',x=>S.desigB=x);sub(CONF+'/pessoas',x=>S.pessoas=x);sub(CONF+'/atas',x=>S.atasB=x)}
  render();
}
init();
})();
