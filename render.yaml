services:
  # Backend Web Service (TypeScript Express REST API)
  - type: web
    name: bispado-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FIREBASE_PROJECT_ID
        value: "lcr2-db541"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CORS_ORIGIN
        value: "*"

  # Frontend Static Site (React 18 + Vite SPA)
  - type: web
    name: bispado-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: bispado-backend
          property: host
      - key: VITE_FIREBASE_API_KEY
        value: "AIzaSyCz0JizuP4pDB8GWwKWgOu4dOY1LY_C6ik"
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: "lcr2-db541.firebaseapp.com"
      - key: VITE_FIREBASE_PROJECT_ID
        value: "lcr2-db541"
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: "lcr2-db541.firebasestorage.app"
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "339421225596"
      - key: VITE_FIREBASE_APP_ID
        value: "1:339421225596:web:2c0a44ce3bff66d6261ff9"
